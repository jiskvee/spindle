name: spindle
version: "2.0"
description:
  - text: "🔧 SPiNDLE 🔧"
    color: "#e77c56"
  - text: "\n"
  - text: "⚡ ʀɪᴅᴇ ᴛʜᴇ ʟɪɢʜᴛɴɪɴɢ ⚡"
    color: "#39b894"

data_pack:
  name: spindle-dp
  load:
    - data/spindle/modules: src
    - .
resource_pack:
  name: spindle-rp
  load: .

require:
  - bolt
  - camellia.clocks
  - camellia.item.load_items

pipeline:
  - mecha
  - beet.contrib.find_replace
  - camellia.item
  - camellia.gen.sounds_json
  - camellia.gen.recipe_outputs
  - camellia.gen.copy_spanish
  - camellia.gen.mcmeta

meta:

  bolt:
    entrypoint:
      - spindle:*

  camellia:
    clocks:
      tick: true
      second_clock: true
      ten_second_clock: true

  find_replace:
    data_pack:
      match:
        - "spindle:*"
    substitute:
      find: "\"@c\""
      replace: "@a[distance=..16]"

  lsp:
    excluded_plugins:
      - beet.contrib.find_replace
      - camellia.gen.updater
      - camellia.gen.sounds_json
      - camellia.gen.recipe_outputs
      - camellia.gen.copy_spanish
      - camellia.gen.mcmeta
